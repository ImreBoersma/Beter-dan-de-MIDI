name: CI

on:
  pull_request:
  workflow_dispatch:

# Least privilege by default; the auto-merge job elevates its own scope.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck & build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # Biome replaces ESLint here: lints, checks formatting and import order.
      - name: Biome
        run: npm run ci

      # `build` is `tsc --noEmit && vite build`, so this typechecks too.
      - name: Build
        run: npm run build

      # Keeps a vulnerable transitive dependency from being merged back in.
      # Remove this step if a new advisory ever needs to land before its fix.
      - name: Audit
        run: npm audit --audit-level=high

  auto-merge:
    name: Auto-merge non-major Dependabot PRs
    needs: verify
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Majors are skipped deliberately — they get reviewed by hand.
      - name: Approve and merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: |
          # Only needed when branch protection requires an approving review, and
          # it fails outright unless Settings → Actions → General → "Allow
          # GitHub Actions to create and approve pull requests" is enabled. Not
          # worth blocking the merge over, so it stays advisory.
          gh pr review --approve "$PR_URL" || echo "::notice::Could not approve; continuing to merge."
          # Prefer native auto-merge (respects branch protection). If the repo
          # has auto-merge disabled, fall back to merging now — `needs: verify`
          # already guarantees lint, build and audit passed.
          gh pr merge --squash --auto "$PR_URL" || gh pr merge --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Note skipped major
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "Major update (${{ steps.meta.outputs.dependency-names }}) — leaving for manual review."
